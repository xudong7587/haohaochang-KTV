services:
  # ARM64 NAS 使用本文件，包含主程序和 CPU 分离。
  # 全部使用 host 网络，无需创建 Docker 子网；分离服务只在本机开放。
  # 新安装：修改密码、核对目录后执行 docker compose -f docker-compose.arm64.yaml up -d。
  # 旧版升级：保留原目录、密码和端口，先执行 docker compose -f docker-compose.arm64.yaml pull ktv。

  # 1. 好好唱主程序——通常只需要修改这一部分
  ktv:
    image: ghcr.io/xudong7587/haohaochang:latest
    network_mode: host
    environment:
      # 【必须修改】设置自己的管理密码，至少 6 位；后台修改后这里保留初始密码即可。
      ADMIN_PASSWORD: "change-this-password-123"
      # 【按需修改】网页访问端口；升级时沿用原端口。
      PORT: "43210"

      # 以下连接参数已配好，无需修改。
      KTV_DISCOVERY_ENABLED: "1"
      KTV_TV_DISCOVERY_ENABLED: "1"
      KTV_LOCAL_SEPARATION: "1"
      KTV_CPU_ENDPOINT: http://127.0.0.1:18002
    volumes:
      # 【核对目录】只改冒号左边，右边保持不变。升级时必须使用原目录。
      # ./ 表示本 Compose 所在目录；也可填写 NAS 的完整路径。
      # 数据库、配置和模型：如改 ./data，下面 CPU 的一处也要同步修改。
      - "./data:/data"
      # 下载暂存目录，例如 "/volume1/ktv/download:/download"。
      - "./download:/download"
      # 正式曲库目录，例如 "/volume1/ktv/media:/media"。
      - "./media:/media"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # 2. CPU 人声分离
  separator-cpu:
    # 分离镜像版本已固定，无需随主程序升级修改。
    image: ghcr.io/xudong7587/haohaochang-separator:1.0.8@sha256:c69112be880d34c31c1366657da5743a4594121428596822036a4b61029ac2d7
    volumes:
      # 【同步目录】冒号左边必须与上面 ktv 的 /data 映射相同。
      - "./data:/data"

    # 以下为自动连接、运行参数和健康检查，无需修改。
    network_mode: host
    environment:
      SEPARATION_CONCURRENCY: "1"
      SEPARATION_TIMEOUT_SECONDS: "21600"
      SEPARATION_SEGMENT: "4"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      SEPARATION_BACKEND: demucs
      SEPARATION_DEVICE: cpu
      SEPARATION_DATA_DIR: /data/separation/demucs
      TORCH_HOME: /data/models
    depends_on:
      ktv:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        until [ -s /data/separation/internal.key ]; do sleep 1; done
        export SEPARATION_API_KEY="$$(cat /data/separation/internal.key)"
        test "$${#SEPARATION_API_KEY}" -eq 64
        if [ -d /data/separator/models ]; then export TORCH_HOME=/data/separator/models; fi
        if [ -d /data/npu/npu-cache ]; then export NPU_CACHE_DIR=/data/npu/npu-cache; fi
        exec nice -n 10 python -m uvicorn app:app --host 127.0.0.1 --port 18002 --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from pathlib import Path; import urllib.request; key=Path('/data/separation/internal.key').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18002/health',headers={'Authorization':'Bearer '+key}),timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
