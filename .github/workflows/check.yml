name: Sign Haohaochang TV v1.1.5.2
on:
  push:
    branches: [codex/tv-v1.1.5.2-official-signing]
permissions:
  contents: read
jobs:
  signed-tv-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Build the release using the existing repository signing key
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          umask 077
          test -n "$TV_KEYSTORE_BASE64"
          export TV_KEYSTORE_FILE="$RUNNER_TEMP/ktv-release.p12"
          trap 'rm -f "$TV_KEYSTORE_FILE"' EXIT
          printf '%s' "$TV_KEYSTORE_BASE64" | base64 --decode > "$TV_KEYSTORE_FILE"
          unset TV_KEYSTORE_BASE64
          gradle -p android --no-daemon assembleRelease
          mkdir -p signed
          cp android/app/build/outputs/apk/release/app-release.apk signed/haohaochang-tv-v1.1.5.2.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify signed/haohaochang-tv-v1.1.5.2.apk
          git rev-parse HEAD > signed/SOURCE_COMMIT.txt
          (cd signed && sha256sum haohaochang-tv-v1.1.5.2.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: haohaochang-tv-v1.1.5.2
          path: signed/
          if-no-files-found: error
